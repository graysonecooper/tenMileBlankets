
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blanket Color Preview</title>

  <style>
    .preview-background {
      background: #f7f3eb;
      border-radius: 10px;
      padding: 12px;
    }
    
    #blanket {
      display: block;
      width: 100%;
      height: auto;
    }
    
    :root {
      --background: #f7f5f0;
      --text: #292724;
      --muted: #77736c;
      --border: #dedbd3;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(26px, 4vw, 38px);
      margin: 0 0 8px;
      letter-spacing: -0.8px;
    }

    header p {
      color: var(--muted);
      margin: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      align-items: start;
    }

    .preview-panel,
    .controls-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }

    .preview-panel h2,
    .controls-panel h2 {
      font-size: 18px;
      margin: 0 0 20px;
    }

    .preview-background {
      background: #f0eee8;
      border-radius: 10px;
      padding: 12px;
    }

    #blanket {
      display: block;
      width: 100%;
      height: auto;
    }

    .preview-caption {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .color-control {
      margin-bottom: 22px;
    }

    .color-control label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .select-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      min-width: 0;
      padding: 12px;
      background: #fff;
      color: var(--text);
      border: 1px solid #ccc8bf;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
    }

    .swatch {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 1px solid #d0cdc6;
      border-radius: 7px;
    }

    .hex-value {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
      font-family: monospace;
    }

    button {
      width: 100%;
      padding: 13px 18px;
      background: #292724;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.82;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 28px;
    }

    @media (max-width: 700px) {
      .page {
        padding: 24px 14px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .preview-panel,
      .controls-panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header>
      <h1>Ten Mile Blankets</h1>
    </header>

    <div class="layout">

      <!-- BLANKET PREVIEW -->
      <section class="preview-panel">
        <h2>Design your blanket</h2>




<div class="preview-background">
  <svg
    id="blanket"
    viewBox="0 0 400 400"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="Blanket with hand-sketched diagonal pencil shading"
  >
    <defs>
      <clipPath id="outerRingClip">
        <path fill-rule="evenodd" d="
          M 5 5 H 395 V 395 H 5 Z
          M 55 55 H 345 V 345 H 55 Z
        "/>
      </clipPath>

      <clipPath id="innerRingClip">
        <path fill-rule="evenodd" d="
          M 55 55 H 345 V 345 H 55 Z
          M 105 105 H 295 V 295 H 105 Z
        "/>
      </clipPath>

      <clipPath id="centerClip">
        <rect x="105" y="105" width="190" height="190"/>
      </clipPath>
    </defs>

    <!-- Colored sections -->
    <rect id="outerShape"
      x="5" y="5" width="390" height="390"
      fill="#653B36"/>

    <rect id="innerShape"
      x="55" y="55" width="290" height="290"
      fill="#B7512C"/>

    <rect id="centerShape"
      x="105" y="105" width="190" height="190"
      fill="#653B36"/>

    <!-- Generated pencil strokes go here -->
    <g id="sketchLayer"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="1.1"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.65">
    </g>
  </svg>
</div>


      </section>

      <!-- COLOR CONTROLS -->
      <section class="controls-panel">
        <h2>Choose Your Colors</h2>

        <div class="color-control">
          <label for="outerColor">
            1. Outer Border
          </label>

          <div class="select-row">
            <select id="outerColor">
              <option value="#653B36" selected>Bark</option>
              <option value="#292929">Coal</option>
              <option value="#243B53">Rain</option>
              <option value="#B7512C">Pumpkin</option>
              <option value="#D6A62E">Sunflower</option>
              <option value="#E8DCC7">Fog</option>
            </select>

            <div class="swatch" id="outerSwatch"></div>
          </div>
<!--
          <span class="hex-value" id="outerHex"></span>
        </div>
    -->  
        <div class="color-control">
          <label for="innerColor">
            2. Center Fill
          </label>

          <div class="select-row">
            <select id="innerColor">
              <option value="#B7512C" selected>Pumpkin</option>
              <option value="#653B36">Bark</option>
              <option value="#292929">Coal</option>
              <option value="#243B53">Rain</option>
              <option value="#D6A62E">Sunflower</option>
              <option value="#E8DCC7">Fog</option>
            </select>

            <div class="swatch" id="innerSwatch"></div>
          </div>
<!--
          <span class="hex-value" id="innerHex"></span>
        </div>
    -->    
<!--
        <div class="color-control">
          <label for="centerColor">
            2. Center Fill
          </label>

          <div class="select-row">
            <select id="centerColor">
              <option value="#B7512C" selected>Pumpkin</option>
              <option value="#653B36">Bark</option>
              <option value="#292929">Coal</option>
              <option value="#243B53">Rain</option>
              <option value="#D6A62E">Sunflower</option>
              <option value="#E8DCC7">Fog</option>
            </select>

            <div class="swatch" id="centerSwatch"></div>
          </div>

          <span class="hex-value" id="centerHex"></span>
        </div>
    -->

        <button id="resetButton" type="button">
          Reset Colors
        </button>
      </section>

    </div>

  </main>

  <script>
    // Default colors when the page loads or is reset.
    const defaults = {
      outer: "#653B36",
      inner: "#B7512C"
  //  ,
  //  center: "#653B36"
    };

    // Update a shape, its color swatch, and its hex label.
    function updateColor(name) {
      const selector = document.getElementById(name + "Color");
      const color = selector.value;

      document.getElementById(name + "Shape")
        .setAttribute("fill", color);

      document.getElementById(name + "Swatch")
        .style.backgroundColor = color;

    //  document.getElementById(name + "Hex")
    //    .textContent = color.toUpperCase();
    }

    // Listen for changes to all three selectors.
    ["outer", "inner"].forEach(function(name) {
      document.getElementById(name + "Color")
        .addEventListener("change", function() {
          updateColor(name);
        });

      // Initialize each color swatch and label.
      updateColor(name);
    });

    // Restore all three default colors.
    document.getElementById("resetButton")
      .addEventListener("click", function() {
        Object.keys(defaults).forEach(function(name) {
          document.getElementById(name + "Color").value =
            defaults[name];

          updateColor(name);
        });
      });

    
function generatePencilStroke({
  x, y, width, height, spacing = 5, amplitude = 1.2
}) {
  // Sweep diagonally from bottom-left to top-right.
  // Each pass turns around and returns on a roughly parallel line.
  const points = [];
  const diagonalLength = width + height;
  const passes = Math.ceil(diagonalLength / spacing) + 2;

  for (let i = 0; i < passes; i++) {
    const offset = i * spacing - height;

    // Parameterize a diagonal line and find where it
    // intersects the rectangular section.
    const intersections = [];

    const addPoint = (px, py) => {
      if (
        px >= x - 0.001 && px <= x + width + 0.001 &&
        py >= y - 0.001 && py <= y + height + 0.001
      ) {
        intersections.push([px, py]);
      }
    };

    addPoint(x, y + height + offset);
    addPoint(x + width, y + height + offset - width);
    addPoint(x + offset + height, y + height);
    addPoint(x + offset, y);

    // Remove duplicate corner intersections.
    const unique = intersections.filter((p, index, arr) =>
      arr.findIndex(q =>
        Math.abs(q[0] - p[0]) < 0.01 &&
        Math.abs(q[1] - p[1]) < 0.01
      ) === index
    );

    if (unique.length < 2) continue;

    // Sort along the diagonal.
    unique.sort((a, b) => a[0] - b[0] + a[1] - b[1]);

    const start = unique[0];
    const end = unique[unique.length - 1];

    // Alternate direction to create one continuous zigzag.
    if (i % 2 === 0) {
      points.push([start, end]);
    } else {
      points.push([end, start]);
    }
  }

  if (!points.length) return "";

  let d = `M ${points[0][0][0]} ${points[0][0][1]}`;

  points.forEach((segment, i) => {
    const [a, b] = segment;

    // Slight wobble makes the stroke look hand-drawn.
    const wobble = Math.sin(i * 2.17) * amplitude;

    d += ` L ${a[0] + wobble} ${a[1] - wobble}`;
    d += ` L ${b[0] - wobble} ${b[1] + wobble}`;
  });

  return d;
}

function drawSketch() {
  const layer = document.getElementById("sketchLayer");
  layer.innerHTML = "";

  const sections = [
    {
      clip: "outerRingClip",
      x: 5, y: 5, width: 390, height: 390
    },
    {
      clip: "innerRingClip",
      x: 55, y: 55, width: 290, height: 290
    },
    {
      clip: "centerClip",
      x: 105, y: 105, width: 190, height: 190
    }
  ];

  sections.forEach(section => {
    const path = document.createElementNS(
      "http://www.w3.org/2000/svg", "path"
    );

    path.setAttribute(
      "d",
      generatePencilStroke({
        ...section,
        spacing: 5,
        amplitude: 1.1
      })
    );

    path.setAttribute("clip-path", `url(#${section.clip})`);
    path.setAttribute("stroke", "#FFFFFF");
    path.setAttribute("stroke-width", "1.1");
    path.setAttribute("fill", "none");

    layer.appendChild(path);
  });
}

drawSketch();

  </script>

</body>
</html>
