
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blanket Color Preview</title>

  <style>
    .preview-background {
      background: #f7f3eb;
      border-radius: 10px;
      padding: 12px;
    }
    
    #blanket {
      display: block;
      width: 100%;
      height: auto;
    }
    
    :root {
      --background: #f7f5f0;
      --text: #292724;
      --muted: #77736c;
      --border: #dedbd3;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(26px, 4vw, 38px);
      margin: 0 0 8px;
      letter-spacing: -0.8px;
    }

    header p {
      color: var(--muted);
      margin: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      align-items: start;
    }

    .preview-panel,
    .controls-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }

    .preview-panel h2,
    .controls-panel h2 {
      font-size: 18px;
      margin: 0 0 20px;
    }

    .preview-background {
      background: #f0eee8;
      border-radius: 10px;
      padding: 12px;
    }

    #blanket {
      display: block;
      width: 100%;
      height: auto;
    }

    .preview-caption {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .color-control {
      margin-bottom: 22px;
    }

    .color-control label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .select-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      min-width: 0;
      padding: 12px;
      background: #fff;
      color: var(--text);
      border: 1px solid #ccc8bf;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
    }

    .swatch {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: 1px solid #d0cdc6;
      border-radius: 7px;
    }

    .hex-value {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
      font-family: monospace;
    }

    button {
      width: 100%;
      padding: 13px 18px;
      background: #292724;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.82;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 28px;
    }

    @media (max-width: 700px) {
      .page {
        padding: 24px 14px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .preview-panel,
      .controls-panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header>
      <h1>Ten Mile Blankets</h1>
    </header>

    <div class="layout">

      <!-- BLANKET PREVIEW -->
      <section class="preview-panel">
        <h2>Design your blanket</h2>




<div class="preview-background">
  <svg id="blanket" viewBox="0 0 400 400"
       xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="Blanket coloring preview">

    <defs>
      <!-- The outer ring, excluding the inner square -->
      <clipPath id="outerClip" clipPathUnits="userSpaceOnUse">
        <path fill-rule="evenodd" d="
          M 5 5 H 395 V 395 H 5 Z
          M 55 55 H 345 V 345 H 55 Z
        "/>
      </clipPath>

      <!-- The inner ring, excluding the center -->
      <clipPath id="innerClip" clipPathUnits="userSpaceOnUse">
        <path fill-rule="evenodd" d="
          M 55 55 H 345 V 345 H 55 Z
          M 105 105 H 295 V 295 H 105 Z
        "/>
      </clipPath>

      <clipPath id="centerClip" clipPathUnits="userSpaceOnUse">
        <rect x="105" y="105" width="190" height="190"/>
      </clipPath>
    </defs>

    <!-- White paper background -->
    <rect width="400" height="400" fill="#FFFFFF"/>

    <!-- Color is added by JavaScript only when selected -->
    <g id="pencilLayer"></g>

    <!-- Section boundaries -->
    <g fill="none" stroke="#777777" stroke-width="0.8">
      <rect x="5" y="5" width="390" height="390"/>
      <rect x="55" y="55" width="290" height="290"/>
      <rect x="105" y="105" width="190" height="190"/>
    </g>
  </svg>
</div>


      </section>

      <!-- COLOR CONTROLS -->
      <section class="controls-panel">
        <h2>Choose Your Colors</h2>

        <div class="color-control">
          <label for="outerColor">
            1. Outer Border
          </label>

          <div class="select-row">
            <select id="outerColor">
              <option value="#653B36" selected>Bark</option>
              <option value="#292929">Coal</option>
              <option value="#243B53">Rain</option>
              <option value="#B7512C">Pumpkin</option>
              <option value="#D6A62E">Sunflower</option>
              <option value="#E8DCC7">Fog</option>
            </select>

            <div class="swatch" id="outerSwatch"></div>
          </div>
<!--
          <span class="hex-value" id="outerHex"></span>
        </div>
    -->  
        <div class="color-control">
          <label for="innerColor">
            2. Center Fill
          </label>

          <div class="select-row">
            <select id="innerColor">
              <option value="#B7512C" selected>Pumpkin</option>
              <option value="#653B36">Bark</option>
              <option value="#292929">Coal</option>
              <option value="#243B53">Rain</option>
              <option value="#D6A62E">Sunflower</option>
              <option value="#E8DCC7">Fog</option>
            </select>

            <div class="swatch" id="innerSwatch"></div>
          </div>
<!--
          <span class="hex-value" id="innerHex"></span>
        </div>
    -->    

        <div class="color-control">
          <label for="centerColor">
            2. Center Fill
          </label>

          <div class="select-row">
            <select id="centerColor">
              <option value="#B7512C" selected>Pumpkin</option>
              <option value="#653B36">Bark</option>
              <option value="#292929">Coal</option>
              <option value="#243B53">Rain</option>
              <option value="#D6A62E">Sunflower</option>
              <option value="#E8DCC7">Fog</option>
            </select>

            <div class="swatch" id="centerSwatch"></div>
          </div>
<!--
          <span class="hex-value" id="centerHex"></span>
        </div>
    -->

        <button id="resetButton" type="button">
          Reset Colors
        </button>
      </section>

    </div>

  </main>

  <script>
    // Default colors when the page loads or is reset.
    const defaults = {
      outer: "#653B36",
      inner: "#B7512C"
  //  ,
    center: "#653B36"
    };

    // Update a shape, its color swatch, and its hex label.
    function updateColor(name) {
      const selector = document.getElementById(name + "Color");
      const color = selector.value;

      document.getElementById(name + "Shape")
        .setAttribute("fill", color);

      document.getElementById(name + "Swatch")
        .style.backgroundColor = color;

    //  document.getElementById(name + "Hex")
    //    .textContent = color.toUpperCase();
    }

    // Listen for changes to all three selectors.
    ["outer", "inner"].forEach(function(name) {
      document.getElementById(name + "Color")
        .addEventListener("change", function() {
          updateColor(name);
        });

      // Initialize each color swatch and label.
      updateColor(name);
    });

    // Restore all three default colors.
    document.getElementById("resetButton")
      .addEventListener("click", function() {
        Object.keys(defaults).forEach(function(name) {
          document.getElementById(name + "Color").value =
            defaults[name];

          updateColor(name);
        });
      });

    

const NS = "http://www.w3.org/2000/svg";

const regions = {
  outer: { clip: "outerClip", x: 5, y: 5, width: 390, height: 390 },
  inner: { clip: "innerClip", x: 55, y: 55, width: 290, height: 290 },
  center: { clip: "centerClip", x: 105, y: 105, width: 190, height: 190 }
};

// Creates a continuous, diagonal, back-and-forth pencil stroke.
// Each short segment gets its own subtly varying stroke width.
function makePencilPoints(region) {
  const { x, y, width, height } = region;

  const points = [];
  const spacing = 3.2;
  const samples = 5;
  const diagonalSlope = 0.32;
  const rows = Math.ceil(height / spacing);

  for (let row = 0; row <= rows; row++) {
    const baseY = y + row * spacing;
    const forward = row % 2 === 0;

    for (let j = 0; j <= width / samples; j++) {
      const t = j / (width / samples);
      const px = x + (forward ? t : 1 - t) * width;

      // A diagonal sweep with subtle hand-drawn waviness.
      const py =
        baseY +
        (px - x) * diagonalSlope +
        Math.sin(px * 0.11 + row * 1.7) * 0.8 +
        Math.sin(px * 0.035 + row * 0.9) * 0.65;

      points.push({ x: px, y: py });
    }
  }

  return points;
}

function drawRegion(name, color) {
  const layer = document.getElementById("pencilLayer");
  const previous = layer.querySelector(`[data-region="${name}"]`);

  if (previous) previous.remove();
  if (!color) return;

  const region = regions[name];
  const points = makePencilPoints(region);

  const group = document.createElementNS(NS, "g");
  group.setAttribute("data-region", name);

  // Hard boundary: no visible pencil marks can enter another section.
  group.setAttribute("clip-path", `url(#${region.clip})`);

  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1];
    const b = points[i];

    const segment = document.createElementNS(NS, "path");
    segment.setAttribute(
      "d",
      `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} L ${b.x.toFixed(2)} ${b.y.toFixed(2)}`
    );
    segment.setAttribute("fill", "none");
    segment.setAttribute("stroke", color);

    // Vary thickness gradually to mimic pressure from a colored pencil.
    const pressure =
      1.35 +
      Math.sin(i * 0.17) * 0.28 +
      Math.sin(i * 0.047 + 1.4) * 0.22 +
      Math.sin(i * 0.013) * 0.15;

    segment.setAttribute("stroke-width", pressure.toFixed(2));
    segment.setAttribute("stroke-linecap", "round");
    segment.setAttribute("stroke-linejoin", "round");
    segment.setAttribute("opacity", "0.82");

    group.appendChild(segment);
  }

  layer.appendChild(group);
}

function updatePencil(name, selectorId) {
  const color = document.getElementById(selectorId).value;
  drawRegion(name, color);
}

document.getElementById("outerColor").addEventListener("change", () =>
  updatePencil("outer", "outerColor")
);

document.getElementById("innerColor").addEventListener("change", () =>
  updatePencil("inner", "innerColor")
);

document.getElementById("centerColor").addEventListener("change", () =>
  updatePencil("center", "centerColor")
);

  </script>

</body>
</html>
